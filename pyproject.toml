[tool.poetry]
name = "conseq"
version = "2.3.0"
description = ""
authors = ["Philip Montgomery <pmontgom@broadinstitute.org>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
colorlog = "^3.0.1"
requests = "^2.31.0"
tabulate = "^0.9.0"
six = "^1.16.0"
Jinja2 = ">=3.1,<4.0"
TatSu = ">=5.18.0,<6.0"
google-cloud-storage = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
pyright-ratchet = {git = "https://github.com/pgm/pyright-ratchet.git"}
hypothesis = "^6.170.15"

[tool.pytest.ini_options]
markers = [
    "fuzz: slow randomized scheduler tests (run with `pytest -m fuzz`, see doc/fuzz-testing.md)",
]
# the fuzz tests are excluded unless explicitly requested with -m fuzz
addopts = "-m 'not fuzz'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
conseq="conseq.main:main"
conseq-helper="conseq.helper:main"
